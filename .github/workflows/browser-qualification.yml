name: Browser qualification
on:
  push:
    branches: [main, "foundation/**", "feature/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:vendor
      - name: Serve studio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/v3d-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/apps/web/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v3d-http.log
          exit 1
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iconic-studio-browser
          path: vyndi-3rd-diamension-studio.png
          if-no-files-found: ignore
