name: Restore worker from git history
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-worker-git.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore worker.mjs from history
        run: |
          set -e
          GOOD=$(git log --pretty=format:%H -- src/worker.mjs | while read c; do
            git show "$c:src/worker.mjs" > /tmp/try.mjs 2>/dev/null || continue
            if grep -q 'OPEN_TOPO_DATASETS' /tmp/try.mjs && grep -q 'issueReceipt' /tmp/try.mjs && ! grep -q 'PLACEHOLDER' /tmp/try.mjs; then
              if node --check /tmp/try.mjs 2>/dev/null; then echo $c; break; fi
            fi
          done)
          echo "Using commit $GOOD"
          git show "$GOOD:src/worker.mjs" > /tmp/w.mjs
          python3 - <<'PY'
from pathlib import Path
t=Path('/tmp/w.mjs').read_text()
block='''    if(url.pathname==="/"||url.pathname==="/merch"||url.pathname==="/merch.html"||url.pathname==="/apps/web/merch"){\n      const assetUrl=new URL(request.url);\n      assetUrl.pathname="/apps/web/merch.html";\n      return secure(await env.ASSETS.fetch(new Request(assetUrl.toString(), request)));\n    }\n    if(url.pathname==="/workbench"||url.pathname==="/studio"){\n      const target=new URL(request.url);target.pathname="/apps/web/";return secure(Response.redirect(target.toString(),302));\n    }\n'''
if 'apps/web/merch.html' not in t:
    t=t.replace('return secure(await env.ASSETS.fetch(request));', block+'    return secure(await env.ASSETS.fetch(request));', 1)
Path('src/worker.mjs').write_text(t)
print(Path('src/worker.mjs').stat().st_size)
PY
          node --check src/worker.mjs
          test -f apps/web/merch.html
      - run: |
          git config user.name "vyndi-restore"
          git config user.email "vyndi-restore@users.noreply.github.com"
          git add src/worker.mjs
          git diff --cached --quiet || git commit -m "Restore worker with merch landing routes"
          git push
