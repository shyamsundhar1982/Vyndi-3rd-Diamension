name: Patch index materials UI
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_index_materials.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_index_materials.py
      - run: python3 scripts/append_app_inspector.py
      - run: |
          git config user.name "vyndi-premium"
          git config user.email "vyndi-premium@users.noreply.github.com"
          git add apps/web/index.html apps/web/app.mjs
          git diff --cached --quiet || git commit -m "Premium UX: material chips drive inspector settings"
          git push
