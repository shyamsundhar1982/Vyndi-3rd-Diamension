name: Apply merch landing
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/merch.html"
      - "scripts/build-web.mjs"
      - "scripts/patch_worker_merch.py"
      - "scripts/patch_merch_nav.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_worker_merch.py
      - run: python3 scripts/patch_merch_nav.py
      - run: node --check src/worker.mjs
      - run: |
          git config user.name "vyndi-merch"
          git config user.email "vyndi-merch@users.noreply.github.com"
          git add src/worker.mjs apps/web/index.html apps/web/merch.html scripts/build-web.mjs
          git diff --cached --quiet || git commit -m "Merch landing at /; workbench at /apps/web/"
          git push
