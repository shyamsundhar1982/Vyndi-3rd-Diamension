name: Apply premium preset UI
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_index_premium.py"
      - "scripts/patch_css_premium.py"
      - "scripts/patch_app_premium.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_index_premium.py
      - run: python3 scripts/patch_css_premium.py
      - run: python3 scripts/patch_app_premium.py
      - run: node --check apps/web/app.mjs
      - run: |
          git config user.name "vyndi-premium"
          git config user.email "vyndi-premium@users.noreply.github.com"
          git add apps/web/index.html apps/web/styles.css apps/web/app.mjs
          git diff --cached --quiet || git commit -m "One-click INDUSTRY PREMIUM preset"
          git push
