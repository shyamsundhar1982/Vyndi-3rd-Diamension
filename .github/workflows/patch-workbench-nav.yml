name: Patch workbench nav
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch_workbench_nav.py"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_workbench_nav.py
      - run: |
          git config user.name "vyndi-ui"
          git config user.email "vyndi-ui@users.noreply.github.com"
          git add apps/web/index.html
          git diff --cached --quiet || git commit -m "Workbench path bar; Merchandise -> local merch landing"
          git push
