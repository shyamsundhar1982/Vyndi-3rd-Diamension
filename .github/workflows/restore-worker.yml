name: Restore worker
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/worker_part_*.b64"
      - "scripts/restore_worker.py"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_worker.py
      - run: node --check src/worker.mjs
      - run: |
          git config user.name "vyndi-restore"
          git config user.email "vyndi-restore@users.noreply.github.com"
          git add src/worker.mjs
          git diff --cached --quiet || git commit -m "Restore full worker with inline merch landing"
          git push
