name: Cloudflare Worker qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate Wrangler configuration and upload bundle
        run: npx wrangler deploy --dry-run
