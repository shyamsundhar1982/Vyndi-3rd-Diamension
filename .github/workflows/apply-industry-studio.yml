name: Apply industry studio
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gen_industry_studio.py"
      - "scripts/industry_panel.html"
      - "scripts/patch_index_industry.py"
      - "scripts/patch_css_industry.py"
      - "scripts/patch_app_industry.py"
      - "scripts/patch_toolkit_coastline.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_industry_studio.py
      - run: python3 scripts/patch_index_industry.py
      - run: python3 scripts/patch_css_industry.py
      - run: python3 scripts/patch_app_industry.py
      - run: python3 scripts/patch_toolkit_coastline.py
      - run: |
          node --check apps/web/app.mjs
          node --check packages/toolkit/toolkit-core.mjs
      - run: |
          git config user.name "vyndi-industry"
          git config user.email "vyndi-industry@users.noreply.github.com"
          git add apps/web/index.html apps/web/styles.css apps/web/app.mjs apps/web/industry-studio.mjs packages/toolkit/toolkit-core.mjs
          git status
          git diff --cached --quiet || git commit -m "Industry studio: all 7 tracks + ROI (batch, coastline, bed-fit)"
          git push
