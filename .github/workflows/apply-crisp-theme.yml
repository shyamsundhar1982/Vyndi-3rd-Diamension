name: Apply crisp workbench theme
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/crisp_theme.css"
      - "scripts/patch_crisp_theme.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_crisp_theme.py
      - run: |
          git config user.name "vyndi-ui"
          git config user.email "vyndi-ui@users.noreply.github.com"
          git add apps/web/styles.css
          git diff --cached --quiet || git commit -m "Workbench: crisp clear theme (anti-fog)"
          git push
