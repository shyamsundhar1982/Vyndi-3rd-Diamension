name: Deploy qualified Workbench V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vyndi-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed095970dde1aa9155ba6c55afad1e835b5f4292
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run
      - name: Deploy qualified revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
      - name: Verify production Workbench V2
        run: |
          node --input-type=module <<'JS'
          const base = 'https://vyndi-3rd-diamension.vayushastr.workers.dev';
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const options = { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) };
              const healthResponse = await fetch(base + '/health', options);
              const health = await healthResponse.json();
              const response = await fetch(base + '/apps/web/?deploy=ed09597&attempt=' + attempt, {headers: {'Cache-Control':'no-cache'}, signal:AbortSignal.timeout(20000)});
              const html = await response.text();
              const stages = ['source', 'event', 'map', 'design', 'make'];
              if (healthResponse.ok && health.ok === true && health.service === 'vyndi-3rd-diamension' &&
                  response.ok && html.includes('id="featureSearch"') &&
                  stages.every(stage => html.includes('data-v2-step="' + stage + '"'))) {
                console.log('Production Workbench V2 markers verified; Wrangler deployment above records the published version.');
                process.exit(0);
              }
            } catch (error) { console.log('Verification retry:', error.message); }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Production Workbench V2 verification failed');
          JS
