name: Deploy premium UI and mesh
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble write_ui_files.py
        run: |
          cat scripts/write_ui_part1.txt scripts/write_ui_part2.txt > scripts/write_ui_files.py
          python3 scripts/write_ui_files.py
      - name: Append app inspector
        run: python3 scripts/append_app_inspector.py
      - name: Premium toolkit patches
        run: python3 packages/toolkit/apply-premium-patches.py
      - name: Syntax check
        run: |
          node --check apps/web/app.mjs
          node --check packages/toolkit/toolkit-core.mjs
      - name: Commit and push
        run: |
          git config user.name "vyndi-premium"
          git config user.email "vyndi-premium@users.noreply.github.com"
          git add apps/web/styles.css apps/web/index.html apps/web/app.mjs packages/toolkit/toolkit-core.mjs
          git status
          git diff --cached --quiet || git commit -m "Premium UI material inspector + mesh quality"
          git push
