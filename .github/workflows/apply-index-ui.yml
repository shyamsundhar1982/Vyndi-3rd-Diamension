name: Apply premium index HTML
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/index_b64_a.txt"
      - "scripts/index_b64_b.txt"
      - "scripts/assemble_index.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/assemble_index.py
      - run: python3 scripts/append_app_inspector.py || true
      - run: |
          git config user.name "vyndi-premium"
          git config user.email "vyndi-premium@users.noreply.github.com"
          git add apps/web/index.html apps/web/app.mjs
          git diff --cached --quiet || git commit -m "Premium index: material chips + inspector"
          git push
